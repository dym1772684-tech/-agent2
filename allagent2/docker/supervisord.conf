[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid

[program:uvicorn]
command=env PYTHONPATH=/app/fastap2:/app/allagent2 python -m uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/fastap2
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:elder_mcp]
command=env PYTHONPATH=/app/fastap2:/app/allagent2 python -m mcp_servers.elder_server
directory=/app/fastap2
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:life_mcp]
command=env PYTHONPATH=/app/fastap2:/app/allagent2 python -m mcp_servers.life_server
directory=/app/fastap2
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
