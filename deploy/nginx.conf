# =============================================================================
# 养老智能体 · Nginx 配置（学习版）
# =============================================================================
# 架构：
#   浏览器 ──► Nginx :80/:443 ──► FastAPI 127.0.0.1:8000（uvicorn 单进程）
#                                    │
#     MCP 数据服务 127.0.0.1:8001/8002/8003（不经过 Nginx，也不对外暴露）
#
# 这份配置覆盖 7 个知识点，按出现顺序：
#   ① upstream + keepalive        长连接复用，减少 TIME_WAIT
#   ② 反代标准头                   真实 IP / 协议 / 原始 Host
#   ③ SSE 流式专项                 proxy_buffering off 是核心，配错就"卡住不出字"
#   ④ gzip 的边界                  压缩 HTML/JS，但绝不能压 event-stream
#   ⑤ 两级限流                      Nginx 按 IP 粗限 + 应用层按用户细限
#   ⑥ 上传与超时                     client_max_body_size / proxy_read_timeout
#   ⑦ 内部端口的隔离                 MCP 只允许内网，绝不对外
#
# 验证：nginx -t && nginx -s reload
# =============================================================================

worker_processes auto;          # 跟 CPU 核数走；Nginx 是单线程事件驱动，靠多进程吃满多核
# worker_rlimit_nofile 65535;   # Linux 专属；Windows 版不支持这行，会报 unknown directive

events {
    worker_connections 4096;    # 单进程最大并发连接；总并发 ≈ worker_processes × 这个值
    multi_accept on;            # 一次 accept 尽量多取连接，高并发下减少系统调用
    # use epoll;                # Linux 用 epoll；Windows 只支持 select，开这行会启动失败
}

http {
    # -------------------------------------------------------------------------
    # 基础
    # -------------------------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;          # 响应头不带版本号，减少指纹信息

    sendfile        on;         # 零拷贝发文件，静态资源快一个量级
    tcp_nopush      on;         # 配合 sendfile，把响应头和正文合并成一次发送
    tcp_nodelay     on;         # 配合 keepalive，小包立即发（SSE 首帧更快）
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 请求体临时目录（上传大文件时先落盘，不占内存）
    # 这两行要求目录已存在，否则 Nginx 启动失败。默认不配也能跑（用 prefix 下的默认目录）。
    # client_body_temp_path temp/client_body;
    # proxy_temp_path       temp/proxy;

    # -------------------------------------------------------------------------
    # ① 日志：把 request_id 和上游耗时打进去，和应用日志能对上
    #    $request_time          Nginx 视角的总耗时
    #    $upstream_response_time 后端耗时（两者差值 = 网络/排队开销）
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time rid=$rid '
                    '"$http_user_agent"';

    # 客户端传了 X-Request-Id 就复用，没传就用 Nginx 生成的
    # （应用侧 request_id.py 的逻辑就是"入站复用"，这里正好对上）
    map $http_x_request_id $rid {
        default $http_x_request_id;
        ""      $request_id;
    }

    access_log logs/access.log main;
    error_log  logs/error.log warn;

    # -------------------------------------------------------------------------
    # ② 上游：FastAPI
    #    keepalive 必须三件套一起配，少一个都退化成短连接：
    #      upstream 里 keepalive N
    #      proxy_http_version 1.1
    #      proxy_set_header Connection ""
    # -------------------------------------------------------------------------
    upstream elder_care_api {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;           # 每个 worker 缓存 32 条空闲长连接
    }

    # 如果将来 uvicorn 起多实例（8000/8010/8020），在这里加 server 即可横向扩展：
    # server 127.0.0.1:8010 max_fails=3 fail_timeout=10s;

    # -------------------------------------------------------------------------
    # ⑤ 两级限流
    #    Nginx 这层按 IP 粗限（防同一出口刷接口），应用层按用户细限（10 次/60s）。
    #    两层职责不同：IP 挡"一个 IP 打很多账号"，用户维度挡"一个账号刷很多次"。
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # ④ gzip
    #    text/html 默认就压，不用列；其余按需。
    #    ★ 绝对不能加 text/event-stream：压缩会攒够一块才输出，SSE 就"卡住不出字"。
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;       # 小于 1KB 压了反而更大（要加头+CPU）
    gzip_comp_level 5;          # 5 是压缩率/CPU 的平衡点，9 收益很小
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # ③ SSE 的关键：把这个 location 的所有缓冲都关掉
    #    在 server 块里用命名 location 复用，避免两处写重复配置
    # -------------------------------------------------------------------------
    # （命名为 @sse，在 server 里 try_files / internal 调用）

    # =========================================================================
    # 主站
    # =========================================================================
    server {
        listen      80;
        # listen      [::]:80;      # 没开 IPv6 的环境会启动失败，按需打开
        server_name localhost;

        # 项目静态页（dashboard.html / auth.html）
        # 部署到 Linux 时改成 /var/www/elder-care 之类
        root  C:/Users/17726/Desktop/练手agent/fastap2;
        index dashboard.html;

        # ⑥ 上传上限：应用前端提示 ≤10MB，这里留 20% 余量给 multipart 边界开销
        client_max_body_size 12m;
        client_body_timeout  60s;

        # 安全响应头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN  always;
        add_header Referrer-Policy        no-referrer  always;
        # dashboard.html 用了内联 script 和 onclick，开 CSP 需要先改造前端，先注释
        # add_header Content-Security-Policy "default-src 'self'" always;

        # ---------------------------------------------------------------
        # ③ SSE 流式对话 —— 全文件最容易配错的地方
        # ---------------------------------------------------------------
        location = /api/v1/agent/chat/stream {
            limit_req zone=api_zone burst=10 nodelay;
            limit_conn conn_zone 20;

            proxy_pass http://elder_care_api;

            proxy_http_version 1.1;             # SSE 必须 1.1，1.0 不支持 chunked
            proxy_set_header Connection "";     # 清掉 close，保住长连接
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $rid;

            # ★★★ 三行决定流式是否可用 ★★★
            proxy_buffering off;                # 不攒包，收到一块就转发一块
            proxy_cache off;                    # 流不缓存
            chunked_transfer_encoding on;       # 保持分块传输

            # 一次推理可能要跑几分钟（多轮工具调用 + 模型生成），设短了会在
            # 中途断流，前端表现为"回答到一半没了"
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 5s;
        }

        # ---------------------------------------------------------------
        # 文件上传（比普通接口慢，单独放宽超时）
        # ---------------------------------------------------------------
        location = /api/v1/agent/files {
            limit_req zone=api_zone burst=5 nodelay;

            proxy_pass http://elder_care_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id      $rid;

            proxy_request_buffering off;        # 边收边转，大文件不先落 Nginx 磁盘
            proxy_read_timeout 120s;
        }

        # ---------------------------------------------------------------
        # 普通 API（JSON 为主）
        # ---------------------------------------------------------------
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_conn conn_zone 30;

            proxy_pass http://elder_care_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $rid;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_next_upstream error timeout http_502 http_503;
        }

        # ---------------------------------------------------------------
        # 监控指标：只允许内网/跳板机访问
        # 应用侧还有 METRICS_TOKEN 的 Bearer 校验，这里是第一层
        # ---------------------------------------------------------------
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny  all;

            proxy_pass http://elder_care_api;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # ---------------------------------------------------------------
        # 静态页
        # ---------------------------------------------------------------
        location = / {
            try_files /dashboard.html =404;
        }

        location ~* \.(html)$ {
            expires -1;                     # 页面不缓存，改完立刻生效
            add_header Cache-Control "no-store";
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;                     # 静态资源缓存一周
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;                 # 静态资源不记日志，省 IO
        }

        # ---------------------------------------------------------------
        # ⑦ MCP 服务端口：显式拒绝
        #    这三个是内部数据服务，权限靠 HMAC 令牌，不该有任何公网入口。
        #    即使误配了监听地址，这一层也直接 403，不浪费一次连接。
        # ---------------------------------------------------------------
        location ~ ^/(mcp-elder|mcp-life|mcp-knowledge)/ {
            deny all;
            return 403;
        }

        # 隐藏文件
        location ~ /\. {
            deny all;
            return 404;
        }

        # 统一错误页
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            default_type text/html;
            return 503 '<html><body style="font-family:sans-serif;padding:40px">
                        <h2>服务暂时不可用</h2><p>请稍后重试；如涉及紧急健康状况请直接拨打 120。</p>
                        </body></html>';
        }
    }

    # =========================================================================
    # HTTPS（生产必须有）
    # 学习环境没有证书可以先注释掉；自签证书：
    #   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
    #     -keyout key.pem -out cert.pem -subj "/CN=localhost"
    # =========================================================================
    # server {
    #     listen 443 ssl;
    #     http2 on;                       # Nginx 1.25.1+ 的写法；更早版本用 listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     C:/nginx/conf/cert.pem;
    #     ssl_certificate_key C:/nginx/conf/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1h;
    #
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     # 其余 location 与 80 端口完全一致，建议抽成 include 片段复用
    #     # include conf.d/elder-care-locations.conf;
    # }
    #
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    # =========================================================================
    # 附：MCP 服务的保护（可选）
    # 默认架构里 MCP 直接监听 127.0.0.1:8001-8003，Nginx 不参与，最安全。
    # 如果一定要经 Nginx 转发（比如想加统一鉴权），必须限制来源：
    # =========================================================================
    # server {
    #     listen 127.0.0.1:8081;          # 只监听回环地址，外网连不上
    #     location / {
    #         allow 127.0.0.1;
    #         deny  all;
    #         proxy_pass http://127.0.0.1:8001;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #         proxy_set_header agent_context $http_agent_context;   # 令牌透传
    #     }
    # }
}
